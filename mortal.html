<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken Series Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html" class="back-btn">⬅ HOME</a>

    <h1>Mortal kombat SERIES</h1>

    <div class="grid-container">

        <div class="game-div" onclick="playGame('psx', 'games/mortal-kombat/mortal-kombat-2/Mortal Kombat II (Japan) (Track 1).bin')">
            <img src="https://m.media-amazon.com/images/M/MV5BMWQ5NjM5NjEtNTNlNS00ZjU1LWE4YTYtNGE3OGY2YTAzYWY1XkEyXkFqcGc@._V1_.jpg"
                alt="Mortal 2">
            <div class="div-details">
                <h3>Mortal 2 </h3>
                <span>PSX CORE</span>
            </div>
        </div>
    </div>

    <div id="emulator-popup">
        <div id="emulator-box">
            <button class="close-btn" onclick="closeGame()">❌ QUIT</button>
            <div id="game-player"></div>
        </div>
    </div>

<script src="./app.js"></script>

</body>

</html>
