<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Fighter Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html" class="back-btn">⬅ HOME</a>

    <h1>STREET FIGHTER SERIES</h1>

    <div class="grid-container">

        <div class="game-div" onclick="playGame('gba', 'games/streetfighters/sf3.gba')">
            <img src="./images/StreetFighterAlpha.jpg" alt="Street Fighter Alpha 3">
            <div class="div-details">
                <h3>Street Fighter Alpha 3</h3>
                <span>GBA CORE</span>
            </div>
        </div>

        <div class="game-div" onclick="playGame('gba', 'games/streetfighters/ssf2.gba')">
            <img src="./images/SuperStreetFighterII.png" alt="Street Fighter Alpha 3">
            <div class="div-details">
                <h3>Super Street Fighter II</h3>
                <span>GBA CORE</span>
                
            </div>
        </div>

        <div class="game-div" onclick="playGame('gba', 'games/streetfighters/tkof.gba')">
            <img src="./images/TheKingOfFighters.jpg" alt="Street Fighter Alpha 3">
            <div class="div-details">
                <h3>The King Of Fighters</h3>
                <span>GBA CORE</span>
            </div>
        </div>

        <div class="game-div" onclick="playGame('segaMD', 'games/streetfighters/sf2_sega.md')">
            <img src="./images/StreetFighterIIChampionEdition.jpg"
                alt="Street Fighter II SEGA">
            <div class="div-details">
                <h3>Street Fighter II: Champion Edition</h3>
                <span>SEGA CORE</span>
            </div>
        </div>
    </div>

    <div id="emulator-popup">
        <div id="emulator-box">
            <button class="close-btn" onclick="closeGame()">❌ QUIT</button>
            <div id="game-player"></div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>

</html>
