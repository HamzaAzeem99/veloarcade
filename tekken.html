<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken Series Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html" class="back-btn">⬅ HOME</a>

    <h1>TEKKEN SERIES</h1>

    <div class="grid-container">

        <div class="game-div" onclick="playGame('gba', 'games/tekken/tk1.gba')">
            <img src="./images/Tekken1.jpg"
                alt="Tekken I">
            <div class="div-details">
                <h3>Tekken 1</h3>
                <span>GBA CORE</span>
            </div>
        </div>
        
    </div>

    <div id="emulator-popup">
        <div id="emulator-box">
            <button class="close-btn" onclick="closeGame()">❌ QUIT</button>
            <div id="game-player"></div>
        </div>
    </div>

<script src="./app.js"></script>

</body>

</html>
